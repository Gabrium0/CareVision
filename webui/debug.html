<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Care Monitor — Private Debug</title>
<style>
  :root { color-scheme:dark; --bg:#0d1117; --panel:#161b22; --line:#30363d;
    --fg:#e6edf3; --dim:#8b949e; --blue:#58a6ff; --green:#3fb950;
    --yellow:#d29922; --red:#f85149; --purple:#bc8cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45
    system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { width:min(1400px,100%); margin:auto; padding:18px 22px 60px; }
  header { position:sticky; top:0; z-index:4; margin:-18px -22px 18px;
    padding:15px 22px; background:#0d1117ee; backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); }
  .head { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }
  h1 { margin:0; font-size:20px; }
  h2 { margin:24px 0 10px; color:var(--blue); font-size:14px;
    letter-spacing:.06em; text-transform:uppercase; }
  h3 { margin:0; font-size:15px; overflow-wrap:anywhere; }
  .status { color:var(--dim); margin-left:auto; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%;
    margin-right:6px; background:var(--yellow); }
  .connected .dot { background:var(--green); box-shadow:0 0 8px var(--green); }
  input { width:min(420px,100%); margin-top:12px; padding:9px 11px;
    border:1px solid var(--line); border-radius:6px; background:#010409; color:var(--fg); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:9px; }
  .tile,.result,details.section { background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:11px 13px; }
  .tile .key,.meta .key { color:var(--dim); font-size:12px; }
  .tile .value { margin-top:2px; font-size:17px; font-weight:650; overflow-wrap:anywhere; }
  .vitals { background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:16px; }
  .vitals-top { display:flex; flex-wrap:wrap; align-items:flex-start; gap:14px; }
  .bpm { min-width:170px; font-size:36px; font-weight:750; line-height:1; }
  .vitals-copy { flex:1; min-width:240px; }
  .state-label { display:inline-block; margin-bottom:6px; padding:2px 9px;
    border:1px solid var(--line); border-radius:999px; text-transform:uppercase;
    letter-spacing:.06em; font-size:11px; }
  .state-ready { color:var(--green); border-color:var(--green); }
  .state-blocked,.state-unavailable { color:var(--red); border-color:var(--red); }
  .state-warming_up,.state-inferring { color:var(--yellow); border-color:var(--yellow); }
  .backend-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:9px; margin-top:14px; }
  .backend { background:#0d1117; border:1px solid var(--line); border-radius:7px; padding:10px; }
  .backend-head { display:flex; justify-content:space-between; gap:8px; font-weight:650; }
  .backend-bpm { margin:10px 0 5px; font-size:27px; font-weight:750; color:#f0f6fc; }
  .backend-bpm.rejected { color:#f2cc60; }
  .backend-bpm.failed { color:#ff7b72; }
  .backend-state { margin-bottom:7px; color:var(--muted); font-size:12px; }
  .progress { height:7px; margin:8px 0; overflow:hidden; border-radius:999px; background:#30363d; }
  .progress > span { display:block; height:100%; background:var(--blue); }
  .small { color:var(--dim); font-size:12px; overflow-wrap:anywhere; }
  .results { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr)); gap:10px; }
  .result-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .badges { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:5px; }
  .badge { border:1px solid var(--line); border-radius:999px; padding:1px 7px;
    color:var(--dim); font-size:11px; }
  .agent_only { color:var(--purple); border-color:#8957e5; }
  .notice { color:var(--blue); } .warning { color:var(--yellow); }
  .alert { color:var(--red); }
  .message { margin:9px 0; }
  .meta { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px 13px; }
  .meta > div { min-width:0; overflow-wrap:anywhere; }
  pre { white-space:pre-wrap; overflow-wrap:anywhere; margin:8px 0 0; padding:9px;
    max-height:420px; overflow:auto; background:#010409; border-radius:6px; color:#c9d1d9; }
  summary { cursor:pointer; color:var(--blue); font-weight:600; }
  .empty { color:var(--dim); font-style:italic; }
  .private-note { color:var(--purple); }
  @media(max-width:600px) { main { padding:12px; } header { margin:-12px -12px 14px; padding:12px; }
    .status { width:100%; margin:0; } .results { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="head">
      <h1>Care Monitor — Private Debug</h1>
      <span class="private-note">localhost only</span>
      <span id="status" class="status"><span class="dot"></span><span id="statusText">connecting…</span></span>
    </div>
    <input id="filter" type="search" placeholder="Filter results by module, key, value, source…">
  </header>
  <div id="root"><p class="empty">Waiting for a live snapshot…</p></div>
</main>
<script>
(() => {
  const root = document.getElementById('root');
  const filter = document.getElementById('filter');
  const status = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  let current = null;
  let renderDeferred = false;
  const panelStates = new Map();

  function el(tag, text, className) {
    const n = document.createElement(tag);
    if (text !== undefined && text !== null) n.textContent = String(text);
    if (className) n.className = className;
    return n;
  }
  function shown(value) {
    if (value === null || value === undefined || value === '') return '—';
    if (typeof value === 'object') return JSON.stringify(value, null, 2);
    return String(value);
  }
  function heading(text) { root.appendChild(el('h2', text)); }
  function tileGrid(values) {
    const grid = el('div', null, 'grid');
    for (const [key, value] of Object.entries(values || {})) {
      const tile = el('div', null, 'tile');
      tile.append(el('div', key.replaceAll('_', ' '), 'key'), el('div', shown(value), 'value'));
      grid.appendChild(tile);
    }
    root.appendChild(grid);
  }
  function jsonSection(title, value, open=false) {
    const box = el('details', null, 'section');
    box.dataset.stateKey = `section:${title}`;
    box.open = open;
    box.append(el('summary', title), el('pre', shown(value)));
    root.appendChild(box);
  }
  function renderVitals(vitals) {
    const v = vitals || {state:'unavailable', bpm:null, guidance:'Vitals diagnostics unavailable', backends:[]};
    const panel = el('section', null, 'vitals');
    const top = el('div', null, 'vitals-top');
    const ready = v.state === 'ready' && Number.isFinite(Number(v.bpm));
    top.appendChild(el('div', ready ? `${Number(v.bpm).toFixed(1)} BPM` : '— BPM', 'bpm'));
    const copy = el('div', null, 'vitals-copy');
    copy.appendChild(el('span', v.state || 'unavailable', `state-label state-${v.state || 'unavailable'}`));
    copy.appendChild(el('div', v.guidance || 'No status available', 'message'));
    const facts = [];
    if (ready) {
      facts.push(`confidence ${shown(v.confidence)}`, `quality ${shown(v.quality)}`,
        `source ${shown(v.source)}`, `age ${shown(v.measurement_age_seconds)}s`);
    }
    facts.push(`capture ${v.capture_ready ? 'ready' : 'blocked'}`, `zone ${shown(v.zone)}`);
    copy.appendChild(el('div', facts.join(' · '), 'small'));
    top.appendChild(copy);
    panel.appendChild(top);

    const grid = el('div', null, 'backend-grid');
    for (const backend of (v.backends || [])) {
      const card = el('div', null, 'backend');
      const displayName = backend.name === 'classical' ? 'Classical'
        : String(backend.name || '').startsWith('open-rppg')
          ? `Open-rPPG${backend.name === 'open-rppg' ? '' : ` (${backend.name.slice(10)})`}`
          : shown(backend.name || 'Backend');
      const head = el('div', null, 'backend-head');
      head.append(el('span', displayName),
        el('span', backend.available ? (backend.status || 'available') : 'unavailable',
          backend.available ? 'notice' : 'alert'));
      card.appendChild(head);
      const measurement = backend.measurement || {};
      const hasBpm = measurement.bpm !== null && measurement.bpm !== undefined
        && Number.isFinite(Number(measurement.bpm));
      const bpmClass = ['rejected', 'failed'].includes(measurement.state)
        ? `backend-bpm ${measurement.state}` : 'backend-bpm';
      card.appendChild(el('div', hasBpm ? `${Number(measurement.bpm).toFixed(1)} BPM` : '— BPM', bpmClass));
      const measurementFacts = [measurement.state || 'warming_up'];
      if (hasBpm) {
        measurementFacts.push(`confidence ${shown(measurement.confidence)}`,
          `quality ${shown(measurement.quality)}`,
          `age ${shown(measurement.measurement_age_seconds)}s`);
      }
      if (measurement.rejection_reason) measurementFacts.push(measurement.rejection_reason);
      card.appendChild(el('div', measurementFacts.join(' · '), 'backend-state'));
      const progress = Math.max(0, Math.min(1, Number(backend.progress || 0)));
      const bar = el('div', null, 'progress');
      const fill = el('span');
      fill.style.width = `${Math.round(progress * 100)}%`;
      bar.appendChild(fill);
      card.appendChild(bar);
      card.appendChild(el('div',
        `${shown(backend.buffered_seconds)}/${shown(backend.required_seconds)}s · ` +
        `${shown(backend.samples)}/${shown(backend.required_samples)} samples · ` +
        `${shown(backend.effective_sample_hz)} Hz`,
        'small'));
      card.appendChild(el('div',
        `accepted ${shown(backend.accepted)} · rejected ${shown(backend.rejected)} · inference ${shown(backend.inference_latency_ms)}ms`,
        'small'));
      grid.appendChild(card);
    }
    if (!(v.backends || []).length) grid.appendChild(el('p', 'No configured heart-rate backend.', 'empty'));
    panel.appendChild(grid);
    root.appendChild(panel);
  }
  function renderAudio(audio) {
    const a = audio || {};
    const detector = a.detector || {};
    const microphone = a.microphone || {};
    const yamnet = a.yamnet || {};
    const stt = a.stt || {};
    tileGrid({
      enabled: a.enabled === true,
      mode: a.mode || detector.mode || 'disabled',
      microphone: `${microphone.status || 'unavailable'} · ${microphone.detail || 'no detail'}`,
      yamnet: `${yamnet.status || 'unavailable'} · ${yamnet.detail || 'no detail'}`,
      whisper_status: stt.status || 'unavailable',
      whisper_worker_alive: stt.worker_alive === true,
      whisper_model: stt.model || '—',
      whisper_load_latency_ms: stt.load_latency_ms,
      detector_status: detector.status || 'unavailable',
      worker_alive: detector.worker_alive === true,
      windows_processed: detector.windows_processed || 0,
      last_inference_at: detector.last_inference_at
        ? new Date(detector.last_inference_at * 1000).toLocaleTimeString() : '—',
      latest_cough_confidence: detector.latest_cough_confidence,
      peak_cough_confidence: detector.peak_cough_confidence,
      threshold: detector.threshold,
      pending_cough_episode: detector.pending_cough_episode === true,
      pending_burst_count: detector.pending_burst_count || 0,
    });
  }
  function resultCard(result) {
    const card = el('article', null, 'result');
    const head = el('div', null, 'result-head');
    head.appendChild(el('h3', `${result.module}.${result.key}`));
    const badges = el('div', null, 'badges');
    for (const [text, cls] of [
      [result.visibility, result.visibility], [result.severity, result.severity],
      [`confidence ${shown(result.confidence)}`, ''], [`quality ${shown(result.quality)}`, '']]) {
      badges.appendChild(el('span', text, `badge ${cls || ''}`));
    }
    head.appendChild(badges);
    card.appendChild(head);
    if (result.message) card.appendChild(el('div', result.message, 'message'));
    const value = el('details');
    value.dataset.stateKey = `result:${result.module}:${result.key}`;
    value.open = typeof result.value !== 'object';
    value.append(el('summary', 'Value'), el('pre', shown(result.value)));
    card.appendChild(value);
    const meta = el('div', null, 'meta');
    const skipped = new Set(['module','key','value','message','confidence','quality','severity','visibility']);
    for (const [key, val] of Object.entries(result)) {
      if (skipped.has(key)) continue;
      const item = el('div');
      item.append(el('span', `${key}: `, 'key'), document.createTextNode(shown(val)));
      meta.appendChild(item);
    }
    card.appendChild(meta);
    return card;
  }
  function selectionInsideRoot() {
    const selection = window.getSelection();
    if (!selection || selection.isCollapsed || !selection.rangeCount) return false;
    return root.contains(selection.anchorNode) || root.contains(selection.focusNode);
  }
  function capturePanelState() {
    for (const panel of root.querySelectorAll('details[data-state-key]')) {
      const content = panel.querySelector('pre');
      panelStates.set(panel.dataset.stateKey, {
        open: panel.open,
        scrollTop: content ? content.scrollTop : 0,
        scrollLeft: content ? content.scrollLeft : 0,
      });
    }
  }
  function restorePanelState() {
    for (const panel of root.querySelectorAll('details[data-state-key]')) {
      const saved = panelStates.get(panel.dataset.stateKey);
      if (!saved) continue;
      panel.open = saved.open;
      const content = panel.querySelector('pre');
      if (content) {
        const temporarilyOpen = !saved.open && (saved.scrollTop || saved.scrollLeft);
        if (temporarilyOpen) {
          panel.open = true;
          void content.scrollHeight;
        }
        content.scrollTop = saved.scrollTop;
        content.scrollLeft = saved.scrollLeft;
        if (temporarilyOpen) panel.open = false;
      }
    }
  }
  function render() {
    if (!current) return;
    if (selectionInsideRoot()) {
      renderDeferred = true;
      return;
    }
    renderDeferred = false;
    capturePanelState();
    root.replaceChildren();
    heading('Runtime health');
    tileGrid(current.health || {status:'unavailable'});
    heading('Vitals');
    renderVitals((current.system || {}).vitals);
    heading('Audio & cough detection');
    renderAudio((current.system || {}).audio);
    heading('Runtime performance');
    tileGrid(current.performance);
    heading('Moondream API control');
    tileGrid((current.system || {}).moondream || {});
    heading('NVIDIA skin VLM');
    jsonSection('Latest private request diagnostics',
      (current.system || {}).nvidia_skin || {
        available:false, status:'unavailable', last_attempt:null
      }, true);
    heading('History writer');
    tileGrid((current.system || {}).history_writer || {alive:false, status:'unavailable'});
    heading('Native runtime budgets');
    tileGrid((current.system || {}).runtime_resources || {status:'unavailable'});
    heading('FashionCLIP lifecycle');
    tileGrid((current.system || {}).clothing || {status:'unconfigured'});

    const needle = filter.value.trim().toLowerCase();
    const all = current.results || [];
    const results = needle ? all.filter(r => JSON.stringify(r).toLowerCase().includes(needle)) : all;
    heading(`Results (${results.length} of ${all.length})`);
    if (!results.length) root.appendChild(el('p', 'No matching live results.', 'empty'));
    else {
      const cards = el('div', null, 'results');
      for (const result of results) cards.appendChild(resultCard(result));
      root.appendChild(cards);
    }

    const system = current.system || {};
    heading('System state');
    for (const key of ['capabilities','workflows','reasoning','consent','replay','timeline']) {
      jsonSection(key.replaceAll('_', ' '), system[key]);
    }
    jsonSection('Complete raw JSON', current);
    restorePanelState();
  }
  async function refresh() {
    try {
      const response = await fetch('/debug/state', {cache:'no-store'});
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      current = await response.json();
      status.classList.add('connected');
      statusText.textContent = `live · ${new Date((current.timestamp || 0) * 1000).toLocaleTimeString()}`;
      render();
    } catch (error) {
      status.classList.remove('connected');
      statusText.textContent = `disconnected · ${error.message}`;
    }
  }
  filter.addEventListener('input', render);
  document.addEventListener('selectionchange', () => {
    if (renderDeferred && !selectionInsideRoot()) render();
  });
  refresh();
  setInterval(refresh, 1000);
})();
</script>
</body>
</html>
