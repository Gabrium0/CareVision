<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Care Monitor — Modules</title>
<style>
  :root { --bg:#0b0d10; --panel:#14171b; --fg:#f2f5f7; --dim:#8a929b; --line:#262b30;
    --info:#c8ccd0; --notice:#39c6ff; --warning:#ff9e40; --alert:#ff5a5a; --accent:#7fd0ff;
    --good:#57d977; --bad:#ff5a5a; --tier-high:#3fbf6a; --tier-med:#e0a030; --tier-low:#b06868;
    --tier-na:#5b6169; }
  * { box-sizing:border-box; -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font-size:17px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
  .wrap { max-width:1400px; margin:0 auto; padding:20px 18px 60px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:16px; }
  header h1 { font-size:26px; margin:0; font-weight:800; letter-spacing:.2px; }
  header .meta { color:var(--dim); font-size:15px; }
  .dot { width:11px; height:11px; border-radius:50%; background:var(--dim); display:inline-block; margin-right:8px; }
  .live .dot { background:var(--good); box-shadow:0 0 10px var(--good); }
  .statline { color:var(--dim); font-size:16px; margin:0 0 18px; }
  .statline b { color:var(--fg); font-weight:700; }

  /* module button grid */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; margin-bottom:20px; }
  .mbtn { text-align:left; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    background:var(--panel); color:var(--fg); cursor:pointer; font:inherit; min-height:64px;
    display:flex; flex-direction:column; gap:6px; transition:border-color .15s,background .15s; }
  .mbtn:hover { border-color:var(--accent); }
  .mbtn.sel { border-color:var(--accent); background:#1c2b33; box-shadow:0 0 0 1px var(--accent) inset; }
  .mbtn.dim { opacity:.45; }
  .mrow1 { display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .mlabel { font-weight:700; font-size:15px; line-height:1.25; }
  .mliverow { display:flex; align-items:center; gap:8px; }
  .livedot { width:8px; height:8px; border-radius:50%; background:var(--line); flex:0 0 auto; }
  .livedot.on { background:var(--good); box-shadow:0 0 6px var(--good); }
  .tier { font-size:10px; font-weight:800; letter-spacing:.4px; text-transform:uppercase;
    border-radius:5px; padding:2px 6px; flex:0 0 auto; color:#0b0d10; }
  .tier.t-high { background:var(--tier-high); }
  .tier.t-medium { background:var(--tier-med); }
  .tier.t-low { background:var(--tier-low); color:#f2f5f7; }
  .tier.t-na, .tier.t-unrated { background:var(--tier-na); color:#f2f5f7; }
  .empty { color:var(--dim); font-style:italic; }

  /* detail panel */
  #detail { background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:20px 22px; }
  #detail.empty-panel { color:var(--dim); font-style:italic; }
  .dhead { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .dhead h2 { font-size:22px; margin:0; font-weight:800; }
  .dblurb { color:var(--dim); font-size:15px; margin:6px 0 16px; }
  .drow { margin-bottom:16px; }
  .drow .dlabel { font-size:12px; letter-spacing:.5px; text-transform:uppercase; color:var(--accent);
    margin-bottom:6px; }
  .reliability-note { font-size:15px; line-height:1.4; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border-radius:16px; padding:4px 12px; font-size:13px; border:1px solid var(--line);
    background:#191d21; color:var(--dim); }
  .chip.ok { border-color:var(--good); color:var(--good); background:#12271a; }
  .chip.missing { border-color:var(--bad); color:#ff8a8a; background:#331414; }
  .badge-consent { display:inline-block; border-radius:6px; padding:3px 10px; font-size:13px;
    background:#332412; color:var(--warning); border:1px solid var(--warning); }
  .trigbtn { background:#24313a; color:var(--fg); border:1px solid var(--accent);
    border-radius:8px; padding:10px 18px; font-size:15px; cursor:pointer; font:inherit; }
  .trigbtn:hover:not(:disabled) { background:#2a3a44; }
  .trigbtn:disabled { opacity:.5; cursor:default; }
  .trigresult { margin-top:8px; font-size:14px; }
  .trigresult.ok { color:var(--good); }
  .trigresult.err { color:var(--bad); }
  .passive-note { color:var(--dim); font-size:14px; font-style:italic; }
  .togglerow { display:flex; align-items:center; gap:10px; }
  .toggle-state { font-size:13px; font-weight:700; letter-spacing:.3px; text-transform:uppercase;
    color:var(--dim); min-width:44px; }
  .toggle-state.on { color:var(--good); }
  .togglebtn { padding:8px 16px; font-size:14px; }

  /* live signal list */
  .siglist .sig { display:flex; gap:10px; align-items:center; padding:8px 0;
    border-bottom:1px solid #1c2024; font-size:15px; flex-wrap:wrap; }
  .siglist .sig .txt { flex:1 1 220px; }
  .siglist .sig .meta { color:var(--dim); font-size:13px; white-space:nowrap; }
  .s-info{color:var(--info)} .s-notice{color:var(--notice)} .s-warning{color:var(--warning)} .s-alert{color:var(--alert);font-weight:700}
  .state-msg { color:var(--dim); font-size:15px; line-height:1.4; }
  .sig-subhead { font-size:11px; letter-spacing:.5px; text-transform:uppercase; color:var(--dim);
    margin:14px 0 4px; }
  .sig-subhead:first-child { margin-top:0; }
  .siglist .sig.vlm-sig { border-left:2px solid var(--notice); padding-left:8px; }
  .vlm-chip { display:inline-block; border-radius:5px; padding:1px 6px; font-size:10px;
    font-weight:800; letter-spacing:.4px; text-transform:uppercase; color:#0b0d10;
    background:var(--notice); flex:0 0 auto; }
  .readings { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; }
  .reading { border:1px solid var(--line); border-radius:10px; padding:11px 12px;
    background:#191d21; min-width:0; }
  .reading.stale { border-style:dashed; opacity:.68; }
  .reading.vlm-reading { border-left:2px solid var(--notice); }
  .reading-head { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .reading-name { color:var(--accent); font-size:12px; font-weight:700; line-height:1.3; }
  .reading-backend { color:var(--dim); font-weight:500; }
  .reading-value { font-size:22px; line-height:1.2; margin:5px 0 6px; overflow-wrap:anywhere; }
  .reading-meta { color:var(--dim); font-size:12px; line-height:1.4; }
  .reading-message { font-size:13px; line-height:1.35; margin-top:7px; }
  .reading-state { border-radius:5px; padding:2px 6px; font-size:10px; font-weight:800;
    letter-spacing:.3px; text-transform:uppercase; white-space:nowrap; }
  .reading-state.live { color:var(--good); border:1px solid var(--good); background:#12271a; }
  .reading-state.stale { color:var(--warning); border:1px solid var(--warning); background:#332412; }
  .reading-state.warming { color:var(--notice); border:1px solid var(--notice); background:#102732; }

  @media (max-width:640px){
    header h1 { font-size:22px; }
    .grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); }
    #detail { padding:16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Modules Console</h1>
    <span class="meta"><span id="conn"><span class="dot"></span><span id="cl">connecting…</span></span>
      &middot; non-diagnostic</span>
  </header>
  <div id="statline" class="statline">warming up&hellip;</div>

  <div id="grid" class="grid"><p class="empty">warming up&hellip;</p></div>

  <div id="detail" class="empty-panel">Pick a detector above to see what it needs and what it is seeing right now.</div>
</div>
<script>
(function(){
  const connEl = document.getElementById('conn'), clEl = document.getElementById('cl');
  const statlineEl = document.getElementById('statline');
  const gridEl = document.getElementById('grid');
  const detailEl = document.getElementById('detail');

  // Feature requirement names in display order.
  const FEATURE_ORDER = ['face', 'pose', 'person', 'depth'];
  const FEATURE_LABEL = { face: 'face', pose: 'pose', person: 'person', depth: 'depth' };

  // Currently selected module slug. Kept stable across SSE frames per spec
  // point 7 — selection only changes on a user click.
  let selected = null;
  // In-flight trigger POST guard, keyed by module slug, so a slow request
  // can't be double-fired and so the button re-enables correctly.
  let triggerBusy = null;
  let lastTriggerResult = null; // {module, ok, text}
  // Same in-flight/last-result guards for the primary/secondary pause-resume
  // switches, keyed by "<module>:<scope>" so the two scopes never block or
  // overwrite each other's feedback.
  let toggleBusy = null;
  let lastToggleResult = null; // {module, scope, ok, text}

  // Last-seen full payload, re-rendered whenever selection changes.
  let lastPayload = null;
  let connected = false;
  // Result TTLs belong to the live aggregator, but the console deliberately
  // keeps a browser-session cache so an expired value can remain visible as
  // clearly labelled "last known" data.
  const readingCache = new Map();
  const MAX_CACHED_READINGS = 512;
  let receivedStreamFrame = false;

  function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function conn(on){
    const changed = connected !== on;
    connected = on;
    connEl.classList.toggle('live', on);
    clEl.textContent = on ? 'connected' : 'connecting…';
    // A dropped stream instantly turns cached readings into last-known values
    // instead of leaving old numbers styled as live until another frame lands.
    if(changed && lastPayload){
      renderGrid(lastPayload);
      renderDetail(lastPayload);
    }
  }

  function tierClass(tier){
    const t = String(tier||'').toLowerCase();
    if(t === 'high' || t === 'medium' || t === 'low') return 't-' + t;
    if(t === 'n/a') return 't-na';
    return 't-unrated';
  }
  function tierLabel(tier){
    if(!tier) return 'Unrated';
    if(tier === 'N/A') return 'N/A';
    return String(tier);
  }

  function cadenceText(interval){
    const n = Number(interval);
    if(!n || n <= 0) return 'every frame';
    // Trim trailing .0 for whole-second intervals, keep one decimal otherwise.
    const s = Number.isInteger(n) ? String(n) : n.toFixed(1);
    return `at most once every ${s}s`;
  }

  function confPct(c){
    if(c==null || isNaN(c)) return null;
    return Math.max(0, Math.min(100, Math.round(c*100)));
  }

  function humanize(s){
    return String(s || '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  function backendLabel(name){
    const known = {
      classical: 'Classical',
      open_rppg: 'Open-RPPG',
      heuristic: 'Heuristic',
      hsemotion: 'HSEmotion',
      deepface: 'DeepFace',
      ferplus: 'FER+',
      pyfeat: 'Py-Feat',
      yolo: 'YOLO',
    };
    return known[name] || humanize(name);
  }

  // Build a display-ready roster from payload.modules, defaulting anything
  // absent so a partial backend response never throws.
  function roster(d){
    const modules = (d && Array.isArray(d.modules)) ? d.modules : [];
    return modules.filter(m => m && m.module).map(m => ({
      module: String(m.module),
      label: m.label || m.module,
      blurb: m.blurb || '',
      running: m.running !== false,
      requires: Array.isArray(m.requires) ? m.requires : [],
      interval: (typeof m.interval === 'number') ? m.interval : 0,
      consent: !!m.consent,
      internal: !!m.internal,
      reliability: (m.reliability && typeof m.reliability === 'object') ? m.reliability : null,
      trigger: (m.trigger && typeof m.trigger === 'object') ? m.trigger : null,
      enabled: (m.enabled && typeof m.enabled === 'object') ? {
        primary: !!m.enabled.primary,
        secondary: (m.enabled.secondary === null || m.enabled.secondary === undefined)
          ? null : !!m.enabled.secondary,
      } : { primary: m.running !== false, secondary: null },
      toggleable: (m.toggleable && typeof m.toggleable === 'object') ? {
        primary: !!m.toggleable.primary,
        secondary: !!m.toggleable.secondary,
      } : { primary: false, secondary: false },
      toggle_reason: (m.toggle_reason && typeof m.toggle_reason === 'object') ? {
        primary: m.toggle_reason.primary || null,
        secondary: m.toggle_reason.secondary || null,
      } : { primary: null, secondary: null },
    }));
  }

  // Multi-person tracking must be active in this run before a secondary
  // switch means anything at all -- otherwise every module would show a
  // permanently-disabled control for a feature that does not exist here.
  function trackingActive(d){
    const names = d && d.system && d.system.secondary_modules;
    return Array.isArray(names) && names.length > 0;
  }

  let activeReadingIds = new Set();

  function payloadReadings(d){
    if(d && Array.isArray(d.module_readings)){
      return d.module_readings.filter(r => r && r.module && r.key);
    }
    // Compatibility with an older server during a rolling restart. Those
    // payloads have messages but no dedicated display value.
    const signals = (d && Array.isArray(d.signals)) ? d.signals : [];
    return signals.filter(s => s && s.module && s.key).map(s => ({
      ...s,
      metric: s.key,
      name: humanize(s.key),
      backend: null,
      value: s.value == null ? (s.message || '—') : s.value,
      timestamp: null,
      expires_at: null,
      fresh_for: null,
    }));
  }

  function readingId(reading){
    return `${reading.subject_id || 'primary'}\u0000${reading.module}\u0000${reading.key}`;
  }

  function rememberReadings(d){
    const rows = payloadReadings(d);
    activeReadingIds = new Set();
    const localNow = Date.now()/1000;
    for(const reading of rows){
      const id = readingId(reading);
      const rawFreshFor = reading.fresh_for;
      const freshFor = (rawFreshFor == null || rawFreshFor === '')
        ? null : Number(rawFreshFor);
      activeReadingIds.add(id);
      readingCache.set(id, {
        ...reading,
        _last_seen_local: localNow,
        _deadline_local: Number.isFinite(freshFor)
          ? localNow + Math.max(0, freshFor) : null,
      });
    }
    if(readingCache.size > MAX_CACHED_READINGS){
      const oldest = Array.from(readingCache.entries())
        .sort((a, b) => (a[1]._last_seen_local || 0) - (b[1]._last_seen_local || 0));
      for(const [id] of oldest.slice(0, readingCache.size - MAX_CACHED_READINGS)){
        readingCache.delete(id);
      }
    }
  }

  function isReadingCurrent(reading){
    if(!connected || !activeReadingIds.has(readingId(reading))) return false;
    return reading._deadline_local == null || Date.now()/1000 <= reading._deadline_local;
  }

  function isPlaceholderReading(reading){
    const value = String(reading.value == null ? '' : reading.value).trim();
    return value === '...' || value === '…';
  }

  function currentReadingsFor(moduleSlug){
    return Array.from(readingCache.values())
      .filter(r => r.module === moduleSlug && isReadingCurrent(r));
  }

  function knownReadingsFor(moduleSlug){
    return Array.from(readingCache.values())
      .filter(r => r.module === moduleSlug)
      .sort((a, b) => {
        const metric = String(a.metric || a.key).localeCompare(String(b.metric || b.key));
        if(metric) return metric;
        const backend = String(a.backend || '').localeCompare(String(b.backend || ''));
        if(backend) return backend;
        return String(a.subject_id || '').localeCompare(String(b.subject_id || ''));
      });
  }

  // A signal is a VLM second opinion (as opposed to the module's own
  // heuristic) when it carries the nvidia_vlm source or a vlm_-prefixed key.
  // source/key may be null/undefined on any signal — both checks fail
  // safely to "detector" in that case, never throw.
  function isVlmSignal(sig){
    const src = sig && sig.source;
    const key = sig && sig.key;
    return src === 'nvidia_vlm' || (typeof key === 'string' && key.indexOf('vlm_') === 0);
  }

  // Split a module's signals into its own detector readings and any VLM
  // second-opinion readings, so the two can never render as one unlabelled
  // mixed list (safety-critical: a VLM reading must never look like the
  // detector's own heuristic having fired).
  function splitSignals(signals){
    const detector = [], vlm = [];
    for(const s of signals){
      (isVlmSignal(s) ? vlm : detector).push(s);
    }
    return { detector, vlm };
  }

  function featuresOf(d){
    const f = (d && d.system && d.system.features && typeof d.system.features === 'object')
      ? d.system.features : {};
    return f;
  }

  function unmetRequires(mod, features){
    return (mod.requires || []).filter(r => !features[r]);
  }

  function renderStatline(d){
    const counts = (d && d.module_counts) || {};
    const registered = (typeof counts.registered === 'number') ? counts.registered : null;
    const running = (typeof counts.running === 'number') ? counts.running : null;
    if(registered == null && running == null){
      statlineEl.textContent = 'warming up…';
      return;
    }
    statlineEl.innerHTML = `<b>${esc(running ?? '–')}</b> of <b>${esc(registered ?? '–')}</b> detectors running`;
  }

  function renderGrid(d){
    const mods = roster(d);
    if(!mods.length){
      gridEl.innerHTML = '<p class="empty">warming up…</p>';
      return;
    }
    // De-emphasised (internal or not running) modules sort after the rest;
    // within each group, sort by label.
    const list = mods.slice().sort((a, b) => {
      const da = (a.internal || !a.running) ? 1 : 0;
      const db = (b.internal || !b.running) ? 1 : 0;
      if(da !== db) return da - db;
      return a.label.localeCompare(b.label);
    });
    gridEl.innerHTML = list.map(m => {
      const cls = ['mbtn'];
      if(m.internal || !m.running) cls.push('dim');
      if(m.module === selected) cls.push('sel');
      const current = currentReadingsFor(m.module);
      const hasCurrent = current.some(r => !isPlaceholderReading(r));
      const isWarming = current.length > 0 && !hasCurrent;
      const hasKnown = knownReadingsFor(m.module).length > 0;
      const readingState = hasCurrent ? 'live data'
        : (isWarming ? 'warming up' : (hasKnown ? 'last known' : 'quiet'));
      const tier = m.reliability ? m.reliability.tier : null;
      return `<button type="button" class="${cls.join(' ')}" data-module="${esc(m.module)}">` +
        `<div class="mrow1"><span class="mlabel">${esc(m.label)}</span>` +
        `<span class="tier ${tierClass(tier)}">${esc(tierLabel(tier))}</span></div>` +
        `<div class="mliverow"><span class="livedot${hasCurrent?' on':''}"></span>` +
        `<span style="color:var(--dim);font-size:12px;">${readingState}</span></div>` +
        `</button>`;
    }).join('');
  }

  function ageText(reading){
    const lastSeen = Number(reading._last_seen_local);
    if(!Number.isFinite(lastSeen) || lastSeen <= 0) return '';
    const seconds = Math.max(0, Math.floor(Date.now()/1000 - lastSeen));
    if(seconds < 2) return 'just now';
    if(seconds < 60) return `${seconds}s ago`;
    if(seconds < 3600) return `${Math.floor(seconds/60)}m ago`;
    return `${Math.floor(seconds/3600)}h ago`;
  }

  function readingCard(reading){
    const sev = reading.severity || 'info';
    const cpct = confPct(reading.conf);
    const parts = [];
    if(cpct != null) parts.push(`conf ${cpct}%`);
    if(reading.quality != null && !isNaN(reading.quality)){
      parts.push(`quality ${Math.round(reading.quality*100)}%`);
    }
    if(reading.key) parts.push(esc(reading.key));
    if(reading.subject_id && reading.subject_id !== 'primary') parts.push(esc(reading.subject_id));
    const vlm = isVlmSignal(reading);
    const stale = !isReadingCurrent(reading);
    const warming = !stale && isPlaceholderReading(reading);
    const age = ageText(reading);
    const stateText = stale ? `Last known${age ? ' · ' + age : ''}`
      : (warming ? 'Warming up' : 'Live');
    const stateClass = stale ? 'stale' : (warming ? 'warming' : 'live');
    const backend = reading.backend
      ? `<span class="reading-backend"> · ${esc(backendLabel(reading.backend))}</span>` : '';
    const chip = vlm ? '<span class="vlm-chip">VLM</span>' : '';
    const value = (reading.value == null || reading.value === '') ? '—' : reading.value;
    const message = reading.message
      ? `<div class="reading-message s-${esc(sev)}">${esc(reading.message)}</div>` : '';
    return `<div class="reading${stale?' stale':''}${vlm?' vlm-reading':''}">` +
      `<div class="reading-head"><div class="reading-name">${chip}${esc(reading.name || humanize(reading.metric || reading.key))}${backend}</div>` +
      `<span class="reading-state ${stateClass}">${esc(stateText)}</span></div>` +
      `<div class="reading-value s-${esc(sev)}">${esc(value)}</div>` +
      `<div class="reading-meta">${parts.join(' &middot; ')}</div>${message}</div>`;
  }

  function renderTriggerArea(mod){
    if(!mod.trigger){
      return '<div class="passive-note">Passive — fires on its own when the frame allows</div>';
    }
    const t = mod.trigger;
    const busy = triggerBusy === mod.module;
    const label = t.label || t.action || 'Run';
    let resultHtml = '';
    if(lastTriggerResult && lastTriggerResult.module === mod.module){
      resultHtml = `<div class="trigresult ${lastTriggerResult.ok ? 'ok' : 'err'}">${esc(lastTriggerResult.text)}</div>`;
    }
    // The scan itself finishes ~15s after the POST returns, so a healthy
    // "Triggered." says nothing about whether the cloud can answer. Show the
    // provider's own state or an outage looks exactly like a dead button.
    return `<button type="button" class="trigbtn" id="trigBtn" ${busy?'disabled':''}>` +
      `${esc(busy ? 'Running…' : label)}</button>${resultHtml}` +
      providerNote(mod.provider);
  }

  // One pause/resume switch for one scope ('primary' or 'secondary'). Always
  // rendered even when it cannot be toggled -- per this file's "never render
  // a blank panel" rule the disabled state carries its own explanation
  // (toggle_reason) as both the visible note and the button's title/tooltip,
  // so the console never implies a click could grant what a restart or a
  // config/modules.yaml change is actually required for.
  function renderToggle(mod, scope){
    const on = mod.enabled ? mod.enabled[scope] : null;
    const canToggle = !!(mod.toggleable && mod.toggleable[scope]);
    const reason = (mod.toggle_reason && mod.toggle_reason[scope]) || '';
    const key = mod.module + ':' + scope;
    const busy = toggleBusy === key;
    const isOn = on === true;
    const title = canToggle ? '' : (reason || 'This scope cannot be toggled.');
    let resultHtml = '';
    if(lastToggleResult && lastToggleResult.module === mod.module && lastToggleResult.scope === scope){
      resultHtml = `<div class="trigresult ${lastToggleResult.ok ? 'ok' : 'err'}">${esc(lastToggleResult.text)}</div>`;
    }
    const stateLabel = on == null ? 'Unknown' : (isOn ? 'On' : 'Off');
    const btnLabel = busy ? 'Working…' : (isOn ? 'Turn off' : 'Turn on');
    return `<div class="togglerow">` +
      `<span class="toggle-state${isOn ? ' on' : ''}">${esc(stateLabel)}</span>` +
      `<button type="button" class="trigbtn togglebtn" data-scope="${esc(scope)}" ` +
      `${(!canToggle || busy) ? 'disabled' : ''} title="${esc(title)}">${esc(btnLabel)}</button>` +
      `</div>${resultHtml}` +
      (!canToggle && reason ? `<div class="passive-note">${esc(reason)}</div>` : '');
  }

  // Renders nothing while the cloud is healthy — the button already says it.
  function providerNote(p){
    if(!p) return '';
    if(!p.available){
      return '<div class="trigresult err">Cloud vision is off for this run '
        + '(no consent or no credentials).</div>';
    }
    if(p.ok) return '';
    const bits = [];
    if(p.http_status === 400 && p.retryable === false){
      bits.push('The hosted vision model is unavailable (provider reports it degraded).');
    } else if(p.reason){
      bits.push('Last scan failed: ' + esc(String(p.reason))
        + (p.http_status ? ' (HTTP ' + esc(String(p.http_status)) + ')' : '') + '.');
    } else {
      bits.push('The last scan did not complete.');
    }
    if(p.consecutive_failures > 1) bits.push(p.consecutive_failures + ' in a row.');
    const wait = Number(p.retry_in_seconds);
    if(isFinite(wait) && wait > 1) bits.push('Retrying in ' + Math.ceil(wait) + 's.');
    return `<div class="trigresult err">${bits.join(' ')}</div>`;
  }

  // The most important part per spec: never render a blank panel.
  function stateMessage(mod, features, currentCount, knownCount){
    if(!connected){
      return knownCount
        ? 'Live connection lost — showing the last known values below.'
        : 'Live connection lost — waiting to reconnect.';
    }
    const missing = unmetRequires(mod, features);
    if(missing.length){
      const names = missing.map(m => FEATURE_LABEL[m] || m).join(', ');
      return `Waiting on ${esc(names)} — step into view`;
    }
    if(!mod.running){
      return 'Not enabled in config/modules.yaml';
    }
    if(!currentCount && knownCount){
      return connected
        ? 'No current reading — showing the last known values below.'
        : 'Live connection lost — showing the last known values below.';
    }
    if(!knownCount){
      const n = Number(mod.interval);
      const extra = (n && n > 0) ? ` It may take up to ${n}s to report given its cadence.` : '';
      return `Running; nothing to report on this frame.${extra}`;
    }
    return null;
  }

  function renderDetail(d){
    if(!selected){
      detailEl.className = 'empty-panel';
      detailEl.textContent = 'Pick a detector above to see what it needs and what it is seeing right now.';
      return;
    }
    const mods = roster(d);
    const mod = mods.find(m => m.module === selected);
    if(!mod){
      // Selected module vanished from the roster (e.g. stale slug) — explain
      // rather than go blank.
      detailEl.className = 'empty-panel';
      detailEl.textContent = 'This detector is no longer reporting in the current roster.';
      return;
    }
    detailEl.className = '';
    const features = featuresOf(d);
    const readings = knownReadingsFor(mod.module);
    const currentReadings = currentReadingsFor(mod.module);
    const rel = mod.reliability;

    const reqChips = mod.requires.length
      ? mod.requires.map(r => {
          const ok = !!features[r];
          return `<span class="chip ${ok?'ok':'missing'}">${esc(FEATURE_LABEL[r] || r)}${ok?'':' — missing'}</span>`;
        }).join('')
      : '<span class="chip ok">Runs on every frame</span>';

    const relHtml = rel
      ? `<span class="tier ${tierClass(rel.tier)}" style="margin-right:8px;">${esc(tierLabel(rel.tier))}</span>` +
        `<span class="reliability-note">${esc(rel.note || 'No further detail provided.')}</span>`
      : `<span class="tier t-unrated">Unrated</span> <span class="reliability-note">No reliability rating recorded for this module.</span>`;

    const consentHtml = mod.consent ? '<span class="badge-consent">Needs consent</span>' : '';

    const stateMsg = stateMessage(mod, features, currentReadings.length, readings.length);
    let readingsHtml;
    if(readings.length){
      // Detector readings and VLM second-opinion readings are always shown
      // as separate, explicitly labelled groups (detector first) — never as
      // one unlabelled mixed list. A module with only one group shows only
      // that group, still with its heading, so provenance stays explicit.
      const { detector, vlm } = splitSignals(readings);
      const sections = [];
      if(detector.length){
        sections.push(`<div class="sig-subhead">Detector readings</div><div class="readings">${detector.map(readingCard).join('')}</div>`);
      }
      if(vlm.length){
        sections.push(`<div class="sig-subhead">VLM second opinion</div><div class="readings">${vlm.map(readingCard).join('')}</div>`);
      }
      readingsHtml = sections.join('');
    } else {
      readingsHtml = `<div class="state-msg">${stateMsg}</div>`;
    }
    // Requirements, disabled state, expiry, and disconnects stay visible above
    // retained readings so "last known" can never be mistaken for live data.
    const topNote = (readings.length && stateMsg)
      ? `<div class="state-msg" style="margin-bottom:8px;">${stateMsg}</div>` : '';

    const showSecondaryToggle = trackingActive(d);

    detailEl.innerHTML =
      `<div class="dhead"><h2>${esc(mod.label)}</h2>${mod.internal ? '<span class="chip">internal / plumbing</span>' : ''}</div>` +
      `<div class="dblurb">${esc(mod.blurb || 'No description provided.')}</div>` +
      `<div class="drow"><div class="dlabel">Reliability</div>${relHtml}</div>` +
      `<div class="drow"><div class="dlabel">Requires</div><div class="chips">${reqChips}</div></div>` +
      `<div class="drow"><div class="dlabel">Cadence</div><span class="reliability-note">${esc(cadenceText(mod.interval))}</span></div>` +
      (consentHtml ? `<div class="drow">${consentHtml}</div>` : '') +
      `<div class="drow"><div class="dlabel">Primary subject control</div>${renderToggle(mod, 'primary')}</div>` +
      (showSecondaryToggle
        ? `<div class="drow"><div class="dlabel">Secondary subjects control</div>${renderToggle(mod, 'secondary')}</div>`
        : '') +
      `<div class="drow"><div class="dlabel">Trigger</div>${renderTriggerArea(mod)}</div>` +
      `<div class="drow"><div class="dlabel">Readings</div>${topNote}${readingsHtml}</div>`;

    if(mod.trigger){
      const btn = document.getElementById('trigBtn');
      if(btn) btn.addEventListener('click', () => fireTrigger(mod));
    }
    detailEl.querySelectorAll('.togglebtn').forEach(btn => {
      btn.addEventListener('click', () => fireToggle(mod, btn.getAttribute('data-scope')));
    });
  }

  async function fireTrigger(mod){
    if(triggerBusy) return;
    triggerBusy = mod.module;
    renderDetail(lastPayload);
    try{
      const resp = await fetch('/module-control', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: mod.trigger.action, target: mod.trigger.target}),
      });
      let body = null;
      try{ body = await resp.json(); }catch(_){}
      if(resp.ok && body && body.ok){
        lastTriggerResult = { module: mod.module, ok: true, text: 'Triggered.' };
      } else {
        const errText = (body && body.error) ? body.error : ('HTTP ' + resp.status);
        lastTriggerResult = { module: mod.module, ok: false, text: errText };
      }
    }catch(err){
      lastTriggerResult = { module: mod.module, ok: false, text: 'Request failed — is the server running?' };
    }
    triggerBusy = null;
    renderDetail(lastPayload);
  }

  async function fireToggle(mod, scope){
    const key = mod.module + ':' + scope;
    if(toggleBusy) return;
    const turningOn = !(mod.enabled && mod.enabled[scope] === true);
    toggleBusy = key;
    renderDetail(lastPayload);
    try{
      const resp = await fetch('/module-control', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ action: turningOn ? 'enable' : 'disable',
                               target: mod.module, scope }),
      });
      let body = null;
      try{ body = await resp.json(); }catch(_){}
      if(resp.status === 403){
        // Distinct from a generic failure: the toggle was understood and
        // structurally valid, just refused for where the request came from.
        lastToggleResult = { module: mod.module, scope, ok: false,
          text: 'Toggling is only available from the machine running this process.' };
      } else if(resp.ok && body && body.ok){
        const nowOn = body.module && body.module.enabled;
        lastToggleResult = { module: mod.module, scope, ok: true,
          text: nowOn ? 'Turned on.' : 'Turned off.' };
      } else {
        const errText = (body && body.error) ? body.error : ('HTTP ' + resp.status);
        lastToggleResult = { module: mod.module, scope, ok: false, text: errText };
      }
    }catch(err){
      lastToggleResult = { module: mod.module, scope, ok: false,
        text: 'Request failed — is the server running?' };
    }
    toggleBusy = null;
    renderDetail(lastPayload);
  }

  gridEl.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.mbtn');
    if(!btn) return;
    const slug = btn.getAttribute('data-module');
    selected = (selected === slug) ? selected : slug; // click selects; re-click keeps it selected
    lastTriggerResult = null; // clear stale trigger feedback from a previous module
    render(lastPayload);
  });

  function render(d){
    if(!d) return;
    lastPayload = d;
    try{
      rememberReadings(d);
      renderStatline(d);
      renderGrid(d);
      renderDetail(d);
    }catch(_){ /* never let a malformed frame break the stream */ }
  }

  function startSSE(){
    try{
      const es = new EventSource('/data-events');
      es.onopen = ()=>conn(true);
      es.onmessage = e=>{
        receivedStreamFrame = true;
        conn(true);
        try{ render(JSON.parse(e.data)); }catch(_){}
      };
      es.onerror = ()=>conn(false);
    }catch(_){ startPoll(); }
  }
  function startPoll(){
    setInterval(async ()=>{
      try{ const r = await fetch('/data-latest',{cache:'no-store'}); const d = await r.json();
        conn(true); render(d.payload); }catch(_){ conn(false); }
    }, 1000);
  }

  // Initial paint from /data-latest so a freshly-opened page isn't blank
  // while the first SSE frame is in flight.
  (async function initial(){
    try{
      const r = await fetch('/data-latest', {cache:'no-store'});
      const d = await r.json();
      if(!receivedStreamFrame && d && d.payload){ conn(true); render(d.payload); }
    }catch(_){}
  })();

  // Keep expiry labels and "last known" ages accurate even between SSE frames.
  setInterval(()=>{
    if(!lastPayload) return;
    try{ renderGrid(lastPayload); renderDetail(lastPayload); }catch(_){}
  }, 1000);

  if(window.EventSource) startSSE(); else startPoll();
})();
</script>
</body>
</html>
